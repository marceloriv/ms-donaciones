# =============================================
# MS-Donaciones - application.properties
# =============================================

spring.application.name=ms-donaciones

# --- Base de datos ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketti_donaciones}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:ticketti_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8084

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:false}
eureka.instance.prefer-ip-address=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# --- Config Server (opcional) ---
spring.config.import=optional:file:.env[.properties],optional:configserver:http://localhost:8888

# --- Datos de prueba  ---
spring.sql.init.mode=never

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
