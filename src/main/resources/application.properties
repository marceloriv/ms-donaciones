# =============================================
# MS-Donaciones - application.properties
# =============================================

spring.application.name=ms-donaciones
server.port=8084

# --- Base de datos (compatible con Config Server) ---
# Prioriza variables del Config Server, luego fallback local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/donaciones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Eureka Client ---
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.instance.status-page-url-path=/actuator/health
eureka.instance.health-check-url-path=/actuator/health

# --- RabbitMQ (para consumir eventos de MSCarrito) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# --- Logging ---
logging.level.root=INFO
logging.level.com.ticketti=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Actuator / Management ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# --- Config Server (opcional) ---
spring.config.import=optional:file:.env[.properties],optional:configserver:http://localhost:8888

# --- Datos de prueba  ---
spring.sql.init.mode=never

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
